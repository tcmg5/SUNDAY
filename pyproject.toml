[project]
name = "jarvis-desktop"
version = "1.0.0"
description = "A voice-driven desktop assistant in the Iron Man mould: wake word, Claude, tools, and a HUD."
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
