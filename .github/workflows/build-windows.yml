name: Build Windows app

# PyInstaller cannot cross-compile, so the Windows executable has to be built
# on Windows. This runs on every push to a build branch, on demand, and on tags
# (which additionally publish a GitHub Release).
on:
  push:
    branches: ["claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the built artifacts"
        type: boolean
        default: false
      version:
        description: "Version for the release, without the leading v (e.g. 1.0.0)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate the icon
        run: python tools/make_icon.py

      - name: Run the test suite
        run: python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build with PyInstaller
        run: pyinstaller jarvis.spec --noconfirm --clean

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          # `doctor --json` exercises the real import graph inside the packaged
          # binary - the fastest way to catch a module PyInstaller failed to
          # bundle. The console twin is used because the windowed exe writes
          # nowhere.
          #
          # Two traps this step has already fallen into:
          #  * doctor exits 1 whenever anything is unconfigured (no API key on a
          #    runner), and pwsh fails a step on a non-zero $LASTEXITCODE - so
          #    the exit code is deliberately discarded and only the JSON judged.
          #  * grepping the human output for a module name matches its own
          #    "pip install <name>" failure hint, which reported everything
          #    present while everything was missing.
          & ".\dist\JARVIS\JARVIS-console.exe" doctor --json 2>&1 |
            Tee-Object -Variable raw | Out-Null
          $text = $raw -join "`n"
          Write-Host $text
          $global:LASTEXITCODE = 0

          if ($text -match "Traceback|ModuleNotFoundError|UnicodeEncodeError") {
            throw "the packaged executable crashed on startup - see the output above"
          }

          $json = $text -replace '(?s)^[^{]*', ''
          try { $report = $json | ConvertFrom-Json }
          catch { throw "doctor produced no JSON - the executable likely crashed" }

          if (-Not $report.frozen) { throw "doctor did not report itself as a frozen build" }

          # Subsystems that must be inside the bundle. A missing API key or a
          # runner with no sound card is expected here; a missing module is not.
          $required = @("openwakeword", "faster-whisper", "piper", "PySide6", "numpy", "anthropic")
          $missing = @()
          foreach ($name in $required) {
            $entry = $report.checks.$name
            if ($null -eq $entry) { $missing += "$name (not checked)" }
            elseif (-Not $entry.ok) { $missing += "$name -> $($entry.detail)" }
          }
          if ($missing.Count -gt 0) {
            throw "missing from the packaged build:`n  " + ($missing -join "`n  ")
          }

          if (-Not (Test-Path ".\dist\JARVIS\JARVIS.exe")) {
            throw "the windowed executable was not produced"
          }
          Write-Host "Both executables built; all bundled subsystems import cleanly."
          exit 0

      - name: Build the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "packaging\installer.iss"

      - name: Package the portable build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\JARVIS\*" `
            -DestinationPath "packaging\Output\JARVIS-portable-${{ steps.version.outputs.value }}.zip"

      - name: Compute checksums
        id: checksums
        shell: pwsh
        run: |
          $lines = @()
          Get-ChildItem "packaging\Output\*" -Include *.exe, *.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $lines += "$($_.Name)`n``$hash``"
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii "packaging\Output\SHA256SUMS.txt"
          }
          "value<<EOF`n$($lines -join "`n`n")`nEOF" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup-${{ steps.version.outputs.value }}
          path: packaging/Output/JARVIS-Setup-*.exe
          retention-days: 90

      - name: Upload the portable build
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-portable-${{ steps.version.outputs.value }}
          path: packaging/Output/JARVIS-portable-*.zip
          retention-days: 90

      - name: Publish a release
        # Either a pushed tag, or a manual run asking for one. The manual path
        # exists because some environments cannot push tag refs at all; the
        # action creates the tag itself from tag_name at the built commit.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: JARVIS ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: |
            packaging/Output/JARVIS-Setup-*.exe
            packaging/Output/JARVIS-portable-*.zip
            packaging/Output/SHA256SUMS.txt
          body: |
            ## Install

            Download **JARVIS-Setup-${{ steps.version.outputs.value }}.exe** and run it.
            No admin rights needed - it installs to your user profile.

            Windows SmartScreen will warn that the publisher is unknown, because
            this build is not code-signed. Click **More info** then
            **Run anyway**.

            On first launch JARVIS asks for an Anthropic API key and downloads
            about 200 MB of speech models. After that it runs offline apart from
            the reasoning itself.

            ## Verify the download

            Before clicking past the SmartScreen warning, check the file is the
            one this workflow built:

            ```powershell
            Get-FileHash .\JARVIS-Setup-${{ steps.version.outputs.value }}.exe -Algorithm SHA256
            ```

            ${{ steps.checksums.outputs.value }}

            Built from commit ${{ github.sha }} by
            [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
